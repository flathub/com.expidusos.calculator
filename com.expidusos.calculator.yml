app-id: com.expidusos.calculator
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
separate-locales: false
command: calculator
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
modules:
  - name: Calculator
    buildsystem: simple
    build-commands:
      - cp -R bundle /app/expidus_calculator
      - mkdir -p /app/bin
      - ln -s /app/expidus_calculator/calculator /app/bin/calculator
      - chmod +x /app/bin/calculator
      - install -D /app/expidus_calculator/data/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -D /app/expidus_calculator/data/${FLATPAK_ID}.png -t  /app/share/icons/hicolor/256x256/apps/
      - install -D ${FLATPAK_ID}.metainfo.xml -t  /app/share/metainfo/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/ExpidusOS/calculator/releases/download/0.1.1-alpha/com.expidusos.calculator-linux-x64.tar.gz
        sha256: 45197b602cdb0073e5190dadcf6c6f6b0232886c144091d2fdcfc1c792af1349
        dest: bundle
      - type: file
        url: https://github.com/ExpidusOS/calculator/raw/13c73cbb61e928f43a6b3885e11bdced141d7031/data/com.expidusos.calculator.metainfo.xml
        sha256: e28fedc451b26e5635dce12d336d55f619614f4493a8ba2f4b1239b78c06919f
